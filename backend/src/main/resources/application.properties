spring.application.name=airline-backend
server.port=8080

# Embedded H2 database. This lets the project run without installing MySQL.
spring.datasource.url=jdbc:h2:file:./data/airline_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

# JWT
app.jwt.secret=AirlineReservationSystemSecretKey2024VeryLongSecretForJWTSigning
app.jwt.expiration=86400000

# Logging
logging.level.com.airline=INFO
logging.level.org.hibernate.SQL=WARN
