spring.application.name=airline-backend
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/airline_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

app.jwt.secret=${JWT_SECRET:AirlineReservationSystemSecretKey2024VeryLongSecretForJWTSigning}
app.jwt.expiration=86400000
app.google-auth.enabled=${GOOGLE_AUTH_ENABLED:false}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.seat-lock.ttl-minutes=${SEAT_LOCK_TTL_MINUTES:5}

# Google OAuth — defaults allow the app to start even when env vars / google profile are absent.
# application-google.properties (gitignored) overrides these locally; on Render the env vars fill them.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id-for-startup}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-secret-for-startup}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:${BACKEND_URL:{baseUrl}}/login/oauth2/code/{registrationId}}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.com.airline=INFO
logging.level.org.hibernate.SQL=WARN
