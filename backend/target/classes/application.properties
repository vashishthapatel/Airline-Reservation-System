spring.application.name=airline-backend
server.address=0.0.0.0
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/airline_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

app.jwt.secret=${JWT_SECRET:AirlineReservationSystemSecretKey2024VeryLongSecretForJWTSigning}
app.jwt.expiration=86400000
app.google-auth.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.com.airline=INFO
logging.level.org.hibernate.SQL=WARN
