services:
  - type: web
    name: airline-backend
    runtime: docker
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: airline-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: airline-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: airline-db
          property: password
      - key: DATABASE_DRIVER
        value: org.h2.Driver
      - key: JPA_DDL_AUTO
        value: update
      - key: FRONTEND_URL
        fromService:
          type: web
          name: airline-frontend
          property: hostport

  - type: web
    name: airline-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: airline-backend
          property: hostport
        prependPath: /api

databases:
  - name: airline-db
    plan: free
    databaseName: airline_db
    user: airline_user
